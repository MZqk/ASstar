# 每个 stage 报告必须覆盖的字段定义

D1_逻辑专业合理性:
  - stage_objective: 该阶段在天文后期中的目标（一句话）
  - actual_processing_chain: 代码实际执行的子步骤顺序（带 file:line）
  - domain_assumption: 线性/非线性域假设，是否与上下游一致
  - upstream_downstream_contract: 输入契约、输出契约、与相邻 stage 的耦合点
  - degradation_paths: degraded / skipped / failed / passthrough 分支及触发条件
  - professional_soundness: 专业合理性判定（合理 / 存疑 / 不合理）+ 理由
  - risks: 已识别的专业性风险（数据真实性、弱信号、星色、背景压黑等）

D2_门禁来源与归档:
  - gate_inventory: 本阶段全部门禁列表（名称、判定位置 file:line、触发动作）
  - threshold_provenance: 每个阈值来源分类 [hardcoded_literal / PipelineConfig / env_override / runtime_derived / AI_selected / external_tool]
  - config_centralization: 是否符合 AGENTS.md「可调参数集中在 PipelineConfig」要求
  - env_override_control: env 覆盖是否有钳制/白名单/上下限
  - archival_completeness: 判定结果与阈值是否写入 processing-plan.json / pipeline-result.json / run-manifest / checkpoint-manifest / 日志
  - reproducibility: 仅凭归档产物能否事后复现该 gate 判定（可复现 / 部分 / 不可复现）
  - gaps: 归档缺口清单

D3_算法行业标准符合度:
  - algorithm_used: 实际算法名称与实现方式（自研 / Siril 命令 / 第三方模型）
  - industry_baseline: 行业主流做法（PixInsight / Siril / APP / 学术文献），须带 URL
  - conformance: 符合度判定（符合 / 部分符合 / 偏离 / 自创）
  - deviation_analysis: 偏离点及其合理性（是否为 Seestar 特化而合理）
  - known_pitfalls: 该算法在行业内的已知陷阱，代码是否规避
  - improvement_suggestions: 可执行的改进建议（按优先级）

report_format:
  header: "# Stage N 审计报告"
  sections: [摘要与总评分, D1, D2, D3, 关键发现TOP3, 改进建议(P0/P1/P2), 证据索引]
  evidence: 所有代码结论带 `file.py:line`；所有行业结论带可访问 URL
  length: 建议 300-600 行 markdown
  uncertainty: 不确定处显式写「未验证」并说明原因，禁止编造
