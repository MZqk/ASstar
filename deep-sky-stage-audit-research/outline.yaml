topic: 深空天文后期 Pipeline Stage 1-10 三维度审计调研
created: 2026-08-05
repo: /Users/mz/dev/aiseestart

scope:
  dimensions:
    - D1_逻辑专业合理性: 阶段目标、处理顺序、色彩/信号域假设、降级路径是否符合天文后期专业逻辑
    - D2_门禁来源与归档: 每个 gate 的阈值/判据出处（硬编码/PipelineConfig/env/AI/运行时推导）+ 是否落盘到 processing-plan.json / pipeline-result.json / run-manifest / checkpoint-manifest，能否事后复现
    - D3_算法行业标准符合度: 与 PixInsight / Siril / APP / 学术文献的主流实现对标，联网取证

code_map_note: |
  历史命名错位（务必注意）：
  - Stage 6（线性去星）实现在 pipeline/stages/stage7_star_separation.py::run_stage6_star_separation
  - Stage 7（主体拉伸）实现在 pipeline/stages/stage6_stretching.py::run_stage7_stretching
  主类薄封装在 pipeline/seestar_Superimpose.py 约 1882-2130 行。

items:
