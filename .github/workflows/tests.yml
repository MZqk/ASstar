name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_siril_e2e:
        description: Run the prepared real Siril Stage 1-10 regression
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 18 * * 0"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests and coverage
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PIP_CONFIG_FILE: /dev/null
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements.lock

      - name: Run unit suite with branch coverage
        run: |
          python -m pytest -q -rs \
            --cov=gui --cov=pipeline --cov-branch \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=65

      - name: Validate Python and build script syntax
        run: |
          python -m compileall -q gui pipeline tests
          bash -n build/build_macos_app.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: warn

  real-siril-stage1-10:
    name: Real Siril offline Stage 1-10
    needs: unit-tests
    if: >-
      vars.STARUN_REAL_E2E_READY == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_real_siril_e2e))
    runs-on: [self-hosted, macOS, ARM64, starun-e2e]
    timeout-minutes: 210
    env:
      PIP_CONFIG_FILE: /dev/null
      QT_QPA_PLATFORM: offscreen
      STARUN_REAL_E2E_INPUT: ${{ vars.STARUN_REAL_E2E_INPUT }}
      STARUN_REAL_E2E_WORK_DIR: ${{ runner.temp }}/starun-real-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      STARUN_SIRIL_APP: ${{ vars.STARUN_SIRIL_APP }}
      STARUN_SIRIL_SEED: ${{ vars.STARUN_SIRIL_SEED }}
      STARUN_RUNTIME_HOME: ${{ vars.STARUN_RUNTIME_HOME }}
      # Runner-provisioned read-only bundle; model files are not supplied by Git/LFS.
      STARUN_OFFLINE_RESOURCE_ROOT: ${{ vars.STARUN_OFFLINE_RESOURCE_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate prepared offline resource root
        shell: bash
        run: |
          test -n "${STARUN_OFFLINE_RESOURCE_ROOT:-}" || {
            echo "::error::STARUN_OFFLINE_RESOURCE_ROOT is not configured"
            exit 1
          }
          case "${STARUN_OFFLINE_RESOURCE_ROOT}" in
            /*) ;;
            *)
              echo "::error::STARUN_OFFLINE_RESOURCE_ROOT must be an absolute path"
              exit 1
              ;;
          esac
          test -d "${STARUN_OFFLINE_RESOURCE_ROOT}/siril_plugins" || {
            echo "::error::Prepared offline resource root has no siril_plugins directory"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements.lock

      - name: Run real Siril and offline plugin regression
        run: python tests/real_siril_stage1_10_e2e.py

      - name: Upload real pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-siril-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STARUN_REAL_E2E_WORK_DIR }}
          if-no-files-found: warn
