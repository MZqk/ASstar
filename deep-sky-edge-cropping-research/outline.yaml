topic: "深空天文后期处理中场旋、黑边与不可靠边缘像素的裁切逻辑"
topic_slug: "deep-sky-edge-cropping-research"
scope:
  time_range: "不限年代；优先基础资料、当前软件官方文档与近五年工程实践"
  source_priority:
    - "软件、天文机构及标准库官方文档"
    - "同行评审论文与开放获取技术报告"
    - "可验证的开源实现或维护者说明"
    - "社区经验，仅作为补充证据"
  research_goal: "形成可映射到当前项目 Stage 2 的检测、裁切、验证、降级和元数据传播方案"
items:
  - name: "边缘缺陷分类与有效像素语义"
    category: "基础模型"
    description: "区分场旋黑角、配准空白、低覆盖、拒绝像素、插值像素、真实暗背景、负值、校准缺陷、通道错位与卷积振铃，建立裁切与非裁切问题的边界。"
  - name: "配准变换Footprint与覆盖权重检测"
    category: "检测算法"
    description: "研究从每帧几何变换、WCS footprint、参与帧数、有效曝光、weight/context/DQ/rejection map 构造几何有效区和可靠覆盖区的方法。"
  - name: "基于最终图像统计的退化检测"
    category: "检测算法"
    description: "在没有覆盖图或掩膜时，研究零值、NaN、近黑比例、鲁棒背景、亮度台阶、梯度、色偏、连通域及多尺度边缘检测的组合与误判控制。"
  - name: "裁切几何、最大可靠核心与内部空洞"
    category: "区域求解"
    description: "比较四边独立裁切、包围盒、最大内接矩形、共同覆盖区、旋转裁切、非矩形mask，以及内部drizzle holes、坏列和断开区域的处理。"
  - name: "插值支持域与下游安全保护带"
    category: "区域求解"
    description: "研究重采样核、drizzle pixfrac、PSF、卷积、FFT、反卷积、去星和神经网络感受野如何决定mask腐蚀、padding、apodization及最终保护带。"
  - name: "裁切决策、目标保护与停止条件"
    category: "决策门控"
    description: "研究覆盖阈值、最大视场损失、目标ROI、参考星与天空环保护、迭代收敛、置信度、降级和人工复核策略。"
  - name: "多通道、CFA、马赛克与产品目的"
    category: "工作流策略"
    description: "研究RGB/LRGB/窄带共同支持区、Bayer/X-Trans相位、reference/common/union framing、单视场与马赛克，以及science-safe和display-only输出的差异。"
  - name: "WCS与辅助数据传播及科学测量边界"
    category: "数据完整性"
    description: "研究裁切后CRPIX/WCS、尺寸、mask、uncertainty、weight、context、rejection、PSF适用区的同步更新，以及测光、源检测和PSF建模的边缘排除。"
  - name: "主流软件与天文数据管线实践"
    category: "软件实践"
    description: "核验Siril、PixInsight、AstroPixelProcessor、DeepSkyStacker、Astropy/reproject、DrizzlePac和Montage的官方行为、算法能力及边界。"
  - name: "当前项目Stage2差距与实施建议"
    category: "项目映射"
    description: "把研究结论与当前亮度/色偏扫描、edge_black_ratio迭代、固定保护带、裁切报告及续跑契约逐项比较，给出分层改造建议。"
execution:
  batch_size: 3
  items_per_agent: 2
  output_dir: "/Users/mz/dev/aiseestart/deep-sky-edge-cropping-research/results"
  require_user_confirmation_between_batches: true
  result_format: "json"

