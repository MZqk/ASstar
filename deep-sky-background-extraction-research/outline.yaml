topic: 深空天文图像背景提取判定与 Stage 3 阈值依据
items:
  - name: Stage3_阈值与评分溯源
    category: 项目审计
    description: >-
      审计 aiseestart 当前 Stage 3 的 gradient_score、dirty_background_score、
      confidence 计算、阈值来源、提交历史、测试覆盖与尺度敏感性；区分代码事实、
      提交记录、推断和缺失的标定证据。
  - name: 行业与科研判定依据
    category: 外部证据
    description: >-
      调研深空天文后期和科学成像中何时需要背景建模或背景提取，重点覆盖
      Siril、Astropy/Photutils、SExtractor、STScI、ESO 及低表面亮度研究；
      核实是否存在统一行业阈值，并总结扩展天体、IFN、窄带和无真实天空区域时的风险。
  - name: 项目判定门与标定方案
    category: 工程建议
    description: >-
      将外部共识映射为适合本项目的两阶段判定门：先判断是否存在需校正的背景结构，
      再判断自动提取是否安全；提出指标、留出验证、残差诊断、目标保真、人工复核区间、
      数据集标定与阈值版本化方案。
execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: /Users/mz/dev/aiseestart/deep-sky-background-extraction-research/results
